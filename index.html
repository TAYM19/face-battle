<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>קרב הפרצופים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Heebo',system-ui,sans-serif;color:#fff;
  background:linear-gradient(160deg,#251c52 0%,#1a1440 45%,#150f33 100%);
  min-height:100vh;overflow-x:hidden;
  user-select:none;-webkit-user-select:none;
}
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:18px 20px 28px;position:relative}
h1{font-size:30px;font-weight:900;text-align:center;letter-spacing:.5px}
.sub{text-align:center;color:#cfc8f2;font-size:15px;margin-top:8px;line-height:1.5}
.steps{text-align:center;color:#b9b1e6;font-size:13.5px;margin-top:10px}
.steps b{color:#f6c445;font-weight:800}
.cta{
  display:block;width:100%;border:none;cursor:pointer;
  background:linear-gradient(180deg,#f8cd55,#f0a91e);
  color:#3a2503;font-family:inherit;font-weight:800;font-size:19px;
  padding:16px;border-radius:16px;margin-top:auto;
  box-shadow:0 8px 24px rgba(240,169,30,.35),inset 0 1px 0 rgba(255,255,255,.5);
}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.4;box-shadow:none}
.linkbtn{display:block;margin:14px auto 0;background:none;border:none;color:#a99ee0;font-family:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.card{
  position:relative;border-radius:18px;border:2px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.05);padding:10px 6px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;transition:border-color .15s,box-shadow .15s;
}
.card img{height:112px;max-width:100%;object-fit:contain;pointer-events:none}
.card .nm{margin-top:6px;font-weight:700;font-size:16px;color:#e9e4ff}
.card.sel{border-color:#f6c445;box-shadow:0 0 0 3px rgba(246,196,69,.35),0 6px 18px rgba(246,196,69,.18);background:rgba(246,196,69,.08)}
.card .check{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;background:#f6c445;display:none;align-items:center;justify-content:center}
.card.sel .check{display:flex}
.card .check svg{width:14px;height:14px}
.card.taken{opacity:.35;pointer-events:none}
.namefield{width:100%;margin-top:14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;padding:11px 14px;color:#fff;font-family:inherit;font-size:15px;outline:none}
.namefield:focus{border-color:#f6c445}
.namefield::placeholder{color:#8f86c0}
/* character with face */
.charbox{position:relative;display:inline-block}
.charbox>img.cimg{display:block;width:100%}
.face{position:absolute;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:#e8e0d0}
.face img{width:100%;height:100%;object-fit:cover;transform-origin:center;pointer-events:none}
.face.empty{background:#f2e7d3}
/* camera */
.camwrap{position:relative;margin-top:16px;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:3/4}
.camwrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.camhint{text-align:center;color:#cfc8f2;font-size:14px;margin-top:12px}
.shoot{display:flex;justify-content:center;margin-top:16px}
.shutter{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);cursor:pointer;position:relative}
.shutter::after{content:'';position:absolute;inset:5px;border-radius:50%;background:#f6c445}
/* adjust */
.adjwrap{position:relative;margin:14px auto 0;width:100%;max-width:340px}
.adjwrap .charbox{width:100%}
.zoomrow{display:flex;align-items:center;gap:12px;margin-top:14px;color:#cfc8f2;font-size:13px}
.zoomrow input{flex:1;accent-color:#f6c445}
/* scoreboard */
.scorebar{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.pchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 14px 5px 8px}
.pchip.me{border-color:#f6c445;box-shadow:0 0 12px rgba(246,196,69,.35)}
.pchip img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #f6c445}
.pchip .pn{font-weight:700;font-size:14px}
.scorebig{font-size:30px;font-weight:900;color:#f6c445;letter-spacing:2px}
/* ttt */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);border-radius:20px;padding:16px;margin:14px auto 0;width:100%;max-width:330px}
.cell{aspect-ratio:1;border-radius:14px;background:#241a52;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900}
.cell.x{color:#f6c445}.cell.o{color:#7ec8ff}
.cell.win{background:rgba(246,196,69,.25);box-shadow:0 0 14px rgba(246,196,69,.5)}
.turnnote{text-align:center;color:#cfc8f2;font-size:14px;margin-top:14px}
.turnnote b{color:#f6c445}
/* rps */
.rpsrow{display:flex;gap:12px;margin-top:20px}
.rpsbtn{flex:1;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);border-radius:16px;padding:18px 6px;cursor:pointer;color:#fff;font-family:inherit;font-size:17px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:8px}
.rpsbtn svg{width:44px;height:44px}
.rpsbtn:active{border-color:#f6c445}
.rpsreveal{display:flex;justify-content:space-around;align-items:center;margin-top:22px}
.rpspick{text-align:center}
.rpspick .rk{font-size:15px;font-weight:800;margin-top:8px;color:#f6c445}
/* veil */
.veil{margin-top:60px;text-align:center}
.veil .big{font-size:24px;font-weight:800;line-height:1.6}
/* win */
.winstage{position:relative;margin-top:6px;min-height:330px}
.winnerbox{position:absolute;right:-14px;bottom:0;width:64%}
.loserbox{position:absolute;left:-4px;bottom:0;width:37%;opacity:.95}
.dance{animation:dance .8s ease-in-out infinite;transform-origin:bottom center}
@keyframes dance{
 0%,100%{transform:rotate(-6deg) translateY(0) scaleX(1)}
 25%{transform:rotate(4deg) translateY(-14px) scaleX(1.03)}
 50%{transform:rotate(6deg) translateY(0) scaleX(.97)}
 75%{transform:rotate(-4deg) translateY(-10px) scaleX(1.03)}
}
.sad{animation:sad 2.2s ease-in-out infinite;transform-origin:bottom center}
@keyframes sad{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) translateY(3px)}}
.bubble{position:absolute;background:#fff;color:#241a52;font-weight:800;font-size:14.5px;padding:9px 16px;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap;z-index:5}
.bubble::after{content:'';position:absolute;bottom:-7px;right:26px;border:8px solid transparent;border-top-color:#fff;border-bottom:none}
.confetto{position:absolute;width:9px;height:14px;border-radius:2px;top:-20px;animation:fall linear infinite;z-index:1}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
.winline{text-align:center;margin-top:14px}
.winline .t1{font-size:23px;font-weight:900;color:#f6c445}
.winline .t2{font-size:15px;color:#cfc8f2;margin-top:5px}
.roundov{position:fixed;inset:0;background:rgba(12,8,32,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:24px;text-align:center}
.roundov .charbox{width:150px}
.roundov .rt{font-size:24px;font-weight:900;margin-top:16px;color:#f6c445}
.roundov .rs{font-size:15px;color:#cfc8f2;margin-top:6px}
.hidden{display:none!important}
.cta.sticky{position:sticky;bottom:14px;margin-top:14px}
.hdr{display:flex;align-items:center;justify-content:center;position:relative}
.backbtn{position:absolute;right:0;background:rgba(255,255,255,.08);border:none;color:#cfc8f2;border-radius:10px;padding:7px 12px;font-family:inherit;font-size:13.5px;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="filepick" accept="image/*" class="hidden">
<video id="cam" playsinline autoplay muted class="hidden"></video>
<canvas id="cap" class="hidden"></canvas>
<script>
const CHARS=[
 {id:'sumo',name:'סומו',w:378,h:470,fx:231,fy:66,fw:100,fh:112},
 {id:'bodybuilder',name:'שרירן',w:311,h:475,fx:169,fy:70,fw:100,fh:110},
 {id:'ballerina',name:'בלרינה',w:241,h:479,fx:120,fy:82,fw:80,fh:88},
 {id:'disco',name:'דיסקו',w:296,h:484,fx:154,fy:90,fw:88,fh:95},
 {id:'pirate',name:'פיראט',w:332,h:487,fx:191,fy:70,fw:95,fh:100},
 {id:'superhero',name:'גיבור על',w:365,h:471,fx:214,fy:60,fw:100,fh:105},
 {id:'rockstar',name:'רוקסטאר',w:384,h:476,fx:181,fy:74,fw:90,fh:95},
 {id:'chicken',name:'תרנגול',w:365,h:479,fx:189,fy:94,fw:96,fh:100},
];
const WIN_TAUNTS=['אני האלוף!','תראה איך אני רוקד!','אלוף. העולם.','מי הבוס? אני הבוס!','קל מדי...'];
const LOSE_TAUNTS=['...לא יכול להיות','רימאטץ\'. עכשיו.','זה לא נגמר ככה','דרישת בדיקה!','נגמר לך המזל'];
const WIN_SCORE=3;
let S={
 screen:'select1',
 players:[
  {name:'',char:null,face:null,adj:{x:0,y:0,s:1.15}},
  {name:'',char:null,face:null,adj:{x:0,y:0,s:1.15}},
 ],
 sel:null, game:null, score:[0,0], round:1,
 board:null, turn:0, rps:[null,null], seriesWinner:null, ti:0
};
try{const s=localStorage.getItem('facebattle');if(s){const o=JSON.parse(s);if(o&&o.players)S=Object.assign(S,o);}}catch(e){}
function save(){try{localStorage.setItem('facebattle',JSON.stringify({players:S.players,score:S.score,game:S.game,round:S.round}))}catch(e){}}
const app=document.getElementById('app');
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function charOf(p){return CHARS.find(c=>c.id===p.char)}
function charBox(p,cls){
 const c=charOf(p);if(!c)return'';
 const st=`left:${c.fx/c.w*100}%;top:${c.fy/c.h*100}%;width:${c.fw/c.w*100}%;aspect-ratio:${c.fw}/${c.fh}`;
 const inner=p.face?`<img src="${p.face}" style="transform:translate(${p.adj.x}%,${p.adj.y}%) scale(${p.adj.s})">`:'';
 return `<div class="charbox ${cls||''}"><img class="cimg" src="${c.id}.webp" alt="${c.name}"><div class="face${p.face?'':' empty'}" style="${st}">${inner}</div></div>`;
}
function pName(i){return S.players[i].name||('שחקן '+(i+1))}
function scoreBar(active){
 return `<div class="scorebar">
  <div class="pchip${active===1?' me':''}">${S.players[0].face?`<img src="${S.players[0].face}">`:''}<span class="pn">${esc(pName(0))}</span></div>
  <div class="scorebig">${S.score[0]} : ${S.score[1]}</div>
  <div class="pchip${active===0?' me':''}">${S.players[1].face?`<img src="${S.players[1].face}">`:''}<span class="pn">${esc(pName(1))}</span></div>
 </div>`;
}
/* ---------- screens ---------- */
function renderSelect(pi){
 S.screen='select'+pi;
 const taken=S.players[1-pi].char;
 app.innerHTML=`
  <h1>${pi===0?'בחר את הדמות שלך':'שחקן 2 - בחר דמות'}</h1>
  <div class="sub">${pi===0?'הפנים שלך נכנסות ישר לתוך הדמות':'גם לך מגיעה דמות מצחיקה'}</div>
  <div class="steps"><b>1</b> בחר דמות · <b>2</b> צלם סלפי · <b>3</b> נצח והתרברג</div>
  <input class="namefield" id="nm" maxlength="12" placeholder="השם שלך (לא חובה)" value="${esc(S.players[pi].name)}">
  <div class="grid">${CHARS.map(c=>`
   <div class="card${S.sel===c.id?' sel':''}${taken===c.id?' taken':''}" data-id="${c.id}">
    <div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#3a2503" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <img src="${c.id}.webp" alt="${c.name}"><div class="nm">${c.name}</div>
   </div>`).join('')}
  </div>
  <button class="cta sticky" id="go" ${S.sel?'':'disabled'}>צלם סלפי ויאללה</button>`;
 app.querySelectorAll('.card').forEach(el=>el.onclick=()=>{
  S.sel=el.dataset.id;
  app.querySelectorAll('.card').forEach(x=>x.classList.toggle('sel',x.dataset.id===S.sel));
  document.getElementById('go').disabled=false;
 });
 document.getElementById('nm').oninput=e=>{S.players[pi].name=e.target.value.trim()};
 document.getElementById('go').onclick=()=>{S.players[pi].char=S.sel;S.sel=null;renderCam(pi)};
}
let stream=null;
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function renderCam(pi){
 S.screen='cam'+pi;
 const c=charOf(S.players[pi]);
 app.innerHTML=`
  <div class="hdr"><h1 style="font-size:24px">צלם סלפי</h1></div>
  <div class="sub">הפנים שלך יתלבשו על <b style="color:#f6c445">${c.name}</b> - תחייך!</div>
  <div class="camwrap"><video id="pv" playsinline autoplay muted></video></div>
  <div class="shoot"><button class="shutter" id="sh" aria-label="צלם"></button></div>
  <button class="linkbtn" id="up">או העלה תמונה מהגלריה</button>
  <div class="camhint" id="err"></div>`;
 const v=document.getElementById('pv');
 try{
  stopCam();
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960},height:{ideal:1280}},audio:false});
  v.srcObject=stream;
 }catch(e){
  document.getElementById('err').textContent='המצלמה לא זמינה כאן - אפשר להעלות תמונה מהגלריה';
  document.getElementById('sh').style.display='none';
 }
 document.getElementById('sh').onclick=()=>{
  const cv=document.getElementById('cap');
  const vw=v.videoWidth||640,vh=v.videoHeight||480;
  const side=Math.min(vw,vh);
  cv.width=side;cv.height=side;
  const ctx=cv.getContext('2d');
  ctx.translate(side,0);ctx.scale(-1,1);
  ctx.drawImage(v,(vw-side)/2,(vh-side)/2,side,side,0,0,side,side);
  const url=cv.toDataURL('image/jpeg',.85);
  stopCam();S.players[pi].face=url;S.players[pi].adj={x:0,y:0,s:1.15};renderAdjust(pi);
 };
 document.getElementById('up').onclick=()=>{
  const f=document.getElementById('filepick');
  f.onchange=()=>{
   if(!f.files[0])return;
   const r=new FileReader();
   r.onload=()=>{shrink(r.result,url=>{stopCam();S.players[pi].face=url;S.players[pi].adj={x:0,y:0,s:1.15};renderAdjust(pi)})};
   r.readAsDataURL(f.files[0]);f.value='';
  };
  f.click();
 };
}
function shrink(url,cb){
 const im=new Image();
 im.onload=()=>{
  const side=Math.min(im.width,im.height,640);
  const cv=document.getElementById('cap');cv.width=side;cv.height=side;
  cv.getContext('2d').drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,side,side);
  cb(cv.toDataURL('image/jpeg',.85));
 };
 im.src=url;
}
function renderAdjust(pi){
 S.screen='adj'+pi;
 const p=S.players[pi],c=charOf(p);
 app.innerHTML=`
  <div class="hdr"><h1 style="font-size:24px">מכניסים את הפנים</h1></div>
  <div class="sub">גרור את הפנים למקום המושלם על <b style="color:#f6c445">${c.name}</b></div>
  <div class="adjwrap" id="aw">${charBox(p)}</div>
  <div class="zoomrow"><span>זום</span><input type="range" id="zm" min="1" max="2.8" step="0.01" value="${p.adj.s}"></div>
  <button class="cta" id="ok">יאללה, מושלם</button>
  <button class="linkbtn" id="re">צלם מחדש</button>`;
 const fImg=app.querySelector('.face img');
 const apply=()=>{fImg.style.transform=`translate(${p.adj.x}%,${p.adj.y}%) scale(${p.adj.s})`};
 const faceEl=app.querySelector('.face');
 let drag=null;
 faceEl.style.touchAction='none';
 faceEl.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ax:p.adj.x,ay:p.adj.y};faceEl.setPointerCapture(e.pointerId)};
 faceEl.onpointermove=e=>{
  if(!drag)return;
  const r=faceEl.getBoundingClientRect();
  p.adj.x=drag.ax+(e.clientX-drag.x)/r.width*100;
  p.adj.y=drag.ay+(e.clientY-drag.y)/r.height*100;
  apply();
 };
 faceEl.onpointerup=()=>drag=null;
 document.getElementById('zm').oninput=e=>{p.adj.s=+e.target.value;apply()};
 document.getElementById('ok').onclick=()=>{save();pi===0?renderVeil(1):renderMenu()};
 document.getElementById('re').onclick=()=>renderCam(pi);
}
function renderVeil(next){
 S.screen='veil';
 const who=next===1?1:next==='rps1'?1:-1;
 const btn=who>=0?`אני ${esc(pName(who))}, קדימה`:'מסתכלים ביחד!';
 const txt=who>=0?`תעבירו את הטלפון<br>ל${esc(pName(who))}`:'עכשיו אפשר להסתכל ביחד';
 app.innerHTML=`
  <div class="veil">
   <svg width="72" height="72" viewBox="0 0 72 72" fill="none" stroke="#f6c445" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="24" y="8" width="24" height="44" rx="5"/>
    <line x1="31" y1="14" x2="41" y2="14"/>
    <line x1="33" y1="46" x2="39" y2="46"/>
    <path d="M12 62c8-6 16-6 24 0s16 6 24 0" opacity=".7"/>
   </svg>
   <div class="big" style="margin-top:18px">${txt}</div>
  </div>
  <button class="cta" id="go" style="margin-top:60px">${btn}</button>`;
 document.getElementById('go').onclick=()=>{
  if(next===1)renderSelect(1);
  else if(next==='rps1')renderRpsPick(1);
  else if(next==='reveal')renderRpsReveal();
 };
}
function renderMenu(){
 S.screen='menu';
 app.innerHTML=`
  <h1>מה משחקים?</h1>
  <div class="sub">סדרה עד ${WIN_SCORE} ניצחונות - המנצח רוקד על השני</div>
  ${scoreBar(-1)}
  <div class="grid" style="margin-top:22px">
   <div class="card" id="ttt" style="padding:22px 10px">
    <div style="font-size:34px;font-weight:900;letter-spacing:4px"><span style="color:#f6c445">X</span><span style="color:#7ec8ff">O</span></div>
    <div class="nm" style="margin-top:10px">איקס עיגול</div>
   </div>
   <div class="card" id="rps" style="padding:22px 10px">
    <div style="display:flex;gap:6px">${rpsIcon('rock',30)}${rpsIcon('paper',30)}${rpsIcon('scissors',30)}</div>
    <div class="nm" style="margin-top:10px">אבן נייר ומספריים</div>
   </div>
  </div>
  <button class="linkbtn" id="restart">התחל מחדש (דמויות וסלפי)</button>`;
 document.getElementById('ttt').onclick=()=>{S.game='ttt';S.score=[0,0];S.round=1;startTttRound()};
 document.getElementById('rps').onclick=()=>{S.game='rps';S.score=[0,0];S.round=1;startRpsRound()};
 document.getElementById('restart').onclick=()=>{localStorage.removeItem('facebattle');location.reload()};
}
/* ---------- tic tac toe ---------- */
function startTttRound(){
 S.board=Array(9).fill(null);S.turn=S.round%2===1?0:1;renderTtt();
}
function renderTtt(){
 S.screen='ttt';
 const P=S.players[S.turn];
 app.innerHTML=`
  <div class="hdr"><button class="backbtn" id="menu">תפריט</button><h1 style="font-size:22px">איקס עיגול</h1></div>
  <div class="sub">סיבוב ${S.round} · הראשון ל-${WIN_SCORE} מנצח את הסדרה</div>
  ${scoreBar(S.turn)}
  <div class="board">${S.board.map((v,i)=>`<button class="cell${v?' '+(v==='X'?'x':'o'):''}" data-i="${i}">${v||''}</button>`).join('')}</div>
  <div class="turnnote">תור של <b>${esc(pName(S.turn))}</b> (${S.turn===0?'X':'O'})</div>`;
 document.getElementById('menu').onclick=()=>{save();renderMenu()};
 app.querySelectorAll('.cell').forEach(el=>el.onclick=()=>{
  const i=+el.dataset.i;
  if(S.board[i])return;
  S.board[i]=S.turn===0?'X':'O';
  const w=winner(S.board);
  if(w){endRound(w==='D'?-1:(w==='X'?0:1),'ttt')}
  else{S.turn=1-S.turn;renderTtt()}
 });
}
function winner(b){
 const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 for(const l of L){if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])return b[l[0]]}
 return b.every(x=>x)?'D':null;
}
/* ---------- rock paper scissors ---------- */
function rpsIcon(k,size){
 const s=size||44,c='#f6c445';
 if(k==='rock')return `<svg width="${s}" height="${s}" viewBox="0 0 48 48" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"><path d="M12 26v-6a4 4 0 018 0v-4a4 4 0 018 0v4a4 4 0 018 0v6a12 12 0 01-12 12h-2a12 12 0 01-10-6z"/><path d="M12 26l-4-4a3.5 3.5 0 015-5"/></svg>`;
 if(k==='paper')return `<svg width="${s}" height="${s}" viewBox="0 0 48 48" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"><path d="M16 24V10a3 3 0 016 0v12m0-14a3 3 0 016 0v14m0-12a3 3 0 016 0v14a14 14 0 01-14 14h-3a14 14 0 01-11-6l-4-6a3.2 3.2 0 015-4l3 4"/></svg>`;
 return `<svg width="${s}" height="${s}" viewBox="0 0 48 48" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round"><path d="M14 8l12 16M34 8L22 24"/><circle cx="12" cy="34" r="6"/><circle cx="36" cy="34" r="6"/><path d="M22 24l-7 6M22 24l11 6"/></svg>`;
}
const RPS_HE={rock:'אבן',paper:'נייר',scissors:'מספריים'};
function startRpsRound(){S.rps=[null,null];renderRpsPick(0)}
function renderRpsPick(pi){
 S.screen='rpspick';
 app.innerHTML=`
  <div class="hdr"><button class="backbtn" id="menu">תפריט</button><h1 style="font-size:22px">אבן נייר ומספריים</h1></div>
  <div class="sub">סיבוב ${S.round} · הראשון ל-${WIN_SCORE} מנצח את הסדרה</div>
  ${scoreBar(-1)}
  <div class="turnnote" style="font-size:17px;margin-top:26px"><b>${esc(pName(pi))}</b> - בחר בסתר!</div>
  <div class="rpsrow">
   ${['rock','paper','scissors'].map(k=>`<button class="rpsbtn" data-k="${k}">${rpsIcon(k)}${RPS_HE[k]}</button>`).join('')}
  </div>`;
 document.getElementById('menu').onclick=()=>{save();renderMenu()};
 app.querySelectorAll('.rpsbtn').forEach(el=>el.onclick=()=>{
  S.rps[pi]=el.dataset.k;
  pi===0?renderVeil('rps1'):renderVeil('reveal');
 });
}
function renderRpsReveal(){
 S.screen='rpsrev';
 const[a,b]=S.rps;
 const beats={rock:'scissors',paper:'rock',scissors:'paper'};
 const res=a===b?-1:(beats[a]===b?0:1);
 app.innerHTML=`
  <h1 style="font-size:24px">והתוצאה...</h1>
  ${scoreBar(-1)}
  <div class="rpsreveal">
   <div class="rpspick"><div style="font-weight:800;font-size:16px">${esc(pName(0))}</div><div style="margin:14px 0 4px">${rpsIcon(a,64)}</div><div class="rk">${RPS_HE[a]}</div></div>
   <div style="font-size:30px;font-weight:900;color:#f6c445">VS</div>
   <div class="rpspick"><div style="font-weight:800;font-size:16px">${esc(pName(1))}</div><div style="margin:14px 0 4px">${rpsIcon(b,64)}</div><div class="rk">${RPS_HE[b]}</div></div>
  </div>
  <button class="cta" id="go" style="margin-top:44px">${res===-1?'תיקו!':'לתוצאה'}</button>`;
 document.getElementById('go').onclick=()=>endRound(res,'rps');
}
/* ---------- rounds & final ---------- */
function endRound(w,game){
 if(w>=0)S.score[w]++;
 save();
 if(S.score[w]>=WIN_SCORE){S.seriesWinner=w;renderWin();return}
 const ov=document.createElement('div');
 ov.className='roundov';
 ov.innerHTML= w<0
  ?`<div class="rt">תיקו!</div><div class="rs">אף אחד לא לוקח את הסיבוב</div>`
  :`${charBox(S.players[w],'dance')}<div class="rt">${esc(pName(w))} לוקח את הסיבוב!</div><div class="rs">${S.score[0]} : ${S.score[1]}</div>`;
 const btn=document.createElement('button');btn.className='cta';btn.style.marginTop='26px';btn.textContent='סיבוב הבא';
 ov.appendChild(btn);document.body.appendChild(ov);
 btn.onclick=()=>{
  ov.remove();S.round++;save();
  game==='ttt'?startTttRound():startRpsRound();
 };
}
function renderWin(){
 S.screen='win';
 const w=S.seriesWinner,l=1-w;
 const wt=WIN_TAUNTS[Math.floor(Math.random()*WIN_TAUNTS.length)];
 const lt=LOSE_TAUNTS[Math.floor(Math.random()*LOSE_TAUNTS.length)];
 const colors=['#f6c445','#7ec8ff','#ff6b9d','#7dffb2','#c39bff'];
 let conf='';
 for(let i=0;i<40;i++){
  conf+=`<div class="confetto" style="left:${Math.random()*100}%;background:${colors[i%5]};animation-duration:${2.2+Math.random()*2.5}s;animation-delay:${Math.random()*2}s;transform:rotate(${Math.random()*360}deg)"></div>`;
 }
 app.innerHTML=`
  ${scoreBar(-1)}
  <div class="winstage">
   ${conf}
   <div class="bubble" style="top:2%;right:6%">${wt}</div>
   <div class="bubble" style="top:38%;left:2%">${lt}</div>
   <div class="winnerbox">${charBox(S.players[w],'dance')}</div>
   <div class="loserbox">${charBox(S.players[l],'sad')}</div>
  </div>
  <div class="winline">
   <div class="t1">${esc(pName(w))} ניצח ${S.score[w]}-${S.score[l]} בסדרה!</div>
   <div class="t2">הדמות שלו רוקדת על הקבר של ${esc(pName(l))}</div>
  </div>
  <button class="cta" id="re" style="margin-top:18px">רימאטצ'י - שהוא יתנצח</button>
  <button class="linkbtn" id="chg">תחלפו דמויות</button>`;
 document.getElementById('re').onclick=()=>{S.score=[0,0];S.round=1;S.seriesWinner=null;save();S.game==='rps'?startRpsRound():startTttRound()};
 document.getElementById('chg').onclick=()=>{S.score=[0,0];S.round=1;S.seriesWinner=null;S.sel=null;S.players.forEach(p=>{p.char=null;p.face=null;p.comp=null;p.shot=null;p.det=null});save();renderSelect(0)};
}

/* ---------- auto face pipeline (v2) ---------- */
const _imgCache={};
function loadImg(src){
 if(_imgCache[src])return _imgCache[src];
 _imgCache[src]=new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
 return _imgCache[src];
}
function loadScript(src){
 return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)});
}
let _apiReady=null,_model=null;
function loadFaceApi(){
 if(_apiReady)return _apiReady;
 _apiReady=(async()=>{
  await loadScript('face-api.min.js');
  try{await faceapi.nets.ssdMobilenetv1.loadFromUri('./');_model='ssd'}
  catch(e){await faceapi.nets.tinyFaceDetector.loadFromUri('./');_model='tiny'}
 })();
 return _apiReady;
}
async function detectFaceE(img){
 try{
  await loadFaceApi();
  const opts=_model==='ssd'?new faceapi.SsdMobilenetv1Options({minConfidence:0.25}):new faceapi.TinyFaceDetectorOptions({inputSize:608,scoreThreshold:0.2});
  const det=await faceapi.detectSingleFace(img,opts);
  if(!det)return null;
  const b=det.box;
  return {ex:b.x+b.width/2,ey:b.y+b.height*0.5,erx:b.width*0.60,ery:b.height*0.62};
 }catch(e){return null}
}
function ringMean(data,w,h,cx,cy,rx,ry,r0,r1,skipTransparent){
 let rs=0,gs=0,bs=0,n=0;
 const x0=Math.max(0,Math.floor(cx-rx*r1)),x1=Math.min(w-1,Math.ceil(cx+rx*r1));
 const y0=Math.max(0,Math.floor(cy-ry*r1)),y1=Math.min(h-1,Math.ceil(cy+ry*r1));
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
  const dx=(x-cx)/rx,dy=(y-cy)/ry,d=Math.sqrt(dx*dx+dy*dy);
  if(d<r0||d>r1)continue;
  const i=(y*w+x)*4,a=data[i+3];
  if(skipTransparent&&a<200)continue;
  rs+=data[i];gs+=data[i+1];bs+=data[i+2];n++;
 }
 return n?{r:rs/n,g:gs/n,b:bs/n}:null;
}
async function composite(pi){
 const p=S.players[pi],c=charOf(p);
 const spr=await loadImg(c.id+'.webp');
 const cv=document.createElement('canvas');cv.width=c.w;cv.height=c.h;
 const ctx=cv.getContext('2d');
 ctx.drawImage(spr,0,0);
 const shot=await loadImg(p.shot);
 const d=p.det||{ex:shot.width/2,ey:shot.height*0.42,erx:shot.width*0.30,ery:shot.width*0.38};
 const fw=c.fw,fh=c.fh;
 const s0=Math.max(fw/(2*d.erx),fh/(2*d.ery))*1.08*(p.adj?s(p.adj):1);
 function s(a){return a&&a.s?a.s:1}
 const fc=document.createElement('canvas');fc.width=Math.round(fw);fc.height=Math.round(fh);
 const fctx=fc.getContext('2d');
 const offX=(p.adj?p.adj.x:0)/100*fw,offY=(p.adj?p.adj.y:0)/100*fh;
 fctx.drawImage(shot,fw/2-d.ex*s0+offX,fh/2-d.ey*s0+offY,shot.width*s0,shot.height*s0);
 // tone match: character neck ring vs face edge ring
 const neckTone=ringMean(ctx.getImageData(0,0,c.w,c.h).data,c.w,c.h,c.fx,c.fy,fw/2,fh/2,1.03,1.35,true);
 const fImg=fctx.getImageData(0,0,fc.width,fc.height);
 const faceTone=ringMean(fImg.data,fc.width,fc.height,fc.width/2,fc.height/2,fc.width/2,fc.height/2,0.7,0.9,false);
 if(neckTone&&faceTone){
  const gr=1+(Math.min(1.5,Math.max(0.65,neckTone.r/faceTone.r))-1)*0.55;
  const gg=1+(Math.min(1.5,Math.max(0.65,neckTone.g/faceTone.g))-1)*0.55;
  const gb=1+(Math.min(1.5,Math.max(0.65,neckTone.b/faceTone.b))-1)*0.55;
  const dd=fImg.data;
  for(let i=0;i<dd.length;i+=4){dd[i]*=gr;dd[i+1]*=gg;dd[i+2]*=gb}
  fctx.putImageData(fImg,0,0);
 }
 // elliptical feather mask
 const mk=document.createElement('canvas');mk.width=fc.width;mk.height=fc.height;
 const mctx=mk.getContext('2d');
 mctx.translate(fc.width/2,fc.height/2);mctx.scale(1,fc.height/fc.width);
 const g=mctx.createRadialGradient(0,0,0,0,0,fc.width/2);
 g.addColorStop(0.78,'rgba(0,0,0,1)');g.addColorStop(0.97,'rgba(0,0,0,0)');
 mctx.fillStyle=g;mctx.fillRect(-fc.width/2,-fc.width/2,fc.width,fc.width);
 fctx.globalCompositeOperation='destination-in';
 fctx.drawImage(mk,0,0,fc.width,fc.height);
 fctx.globalCompositeOperation='source-over';
 ctx.drawImage(fc,c.fx-fw/2,c.fy-fh/2);
 // chip face crop (square around face)
 const chip=document.createElement('canvas');chip.width=96;chip.height=96;
 chip.getContext('2d').drawImage(fc,fc.width*0.2,fc.height*0.15,fc.width*0.6,fc.height*0.6,0,0,96,96);
 p.face=chip.toDataURL('image/jpeg',0.85);
 p.comp=cv.toDataURL('image/webp',0.92);
}
async function processFace(pi,url){
 S.players[pi].shot=url;
 S.players[pi].det=null;
 S.players[pi].adj={x:0,y:0,s:1};
 const ov=document.createElement('div');
 ov.className='roundov';
 ov.innerHTML='<div class="rt" style="margin-top:0">מזהה את הפנים...</div><div class="rs">שנייה אחת</div>';
 document.body.appendChild(ov);
 const img=await loadImg(url);
 S.players[pi].det=await detectFaceE(img);
 await composite(pi);
 ov.remove();
 renderAdjust(pi);
}
/* ---------- overrides ---------- */
function charBox(p,cls){
 const c=charOf(p);if(!c)return'';
 if(p.comp)return `<div class="charbox ${cls||''}"><img class="cimg" src="${p.comp}" alt="${c.name}"></div>`;
 const st=`left:${c.fx/c.w*100}%;top:${c.fy/c.h*100}%;width:${c.fw/c.w*100}%;aspect-ratio:${c.fw}/${c.fh}`;
 return `<div class="charbox ${cls||''}"><img class="cimg" src="${c.id}.webp" alt="${c.name}"><div class="face empty" style="${st}"></div></div>`;
}
function renderAdjust(pi){
 S.screen='adj'+pi;
 const p=S.players[pi],c=charOf(p);
 app.innerHTML=`
  <div class="hdr"><h1 style="font-size:24px">הפנים על הדמות!</h1></div>
  <div class="sub">${p.det?'זיהינו והדבקנו אוטומטית - אפשר ללטש בגרירה':'לא זיהינו פנים - סדרו ידנית בגרירה'}</div>
  <div class="adjwrap" id="aw"><img id="compImg" src="${p.comp}" style="width:100%;display:block;touch-action:none;cursor:grab"></div>
  <div class="zoomrow"><span>זום</span><input type="range" id="zm" min="0.6" max="2.2" step="0.01" value="${p.adj.s}"></div>
  <button class="cta" id="ok">יאללה, מושלם</button>
  <button class="linkbtn" id="re">צלם / העלה מחדש</button>`;
 const im=document.getElementById('compImg');
 let drag=null,pending=false;
 const refresh=async()=>{if(pending)return;pending=true;await composite(pi);im.src=p.comp;pending=false};
 im.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ax:p.adj.x,ay:p.adj.y};im.setPointerCapture(e.pointerId)};
 im.onpointermove=e=>{
  if(!drag)return;
  const r=im.getBoundingClientRect();
  p.adj.x=drag.ax+(e.clientX-drag.x)/r.width*100*(c.w/c.fw);
  p.adj.y=drag.ay+(e.clientY-drag.y)/r.height*100*(c.h/c.fh);
  refresh();
 };
 im.onpointerup=()=>drag=null;
 document.getElementById('zm').oninput=e=>{p.adj.s=+e.target.value;refresh()};
 document.getElementById('ok').onclick=()=>{save();pi===0?renderVeil(1):renderMenu()};
 document.getElementById('re').onclick=()=>renderCam(pi);
}
async function renderCam(pi){
 S.screen='cam'+pi;
 const c=charOf(S.players[pi]);
 app.innerHTML=`
  <div class="hdr"><h1 style="font-size:24px">צלם סלפי</h1></div>
  <div class="sub">הפנים שלך יתלבשו על <b style="color:#f6c445">${c.name}</b> - אנחנו מדביקים אוטומטית!</div>
  <div class="camwrap"><video id="pv" playsinline autoplay muted></video></div>
  <div class="shoot"><button class="shutter" id="sh" aria-label="צלם"></button></div>
  <button class="linkbtn" id="up">או העלה תמונה מהגלריה</button>
  <div class="camhint" id="err"></div>`;
 const v=document.getElementById('pv');
 try{
  stopCam();
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960},height:{ideal:1280}},audio:false});
  v.srcObject=stream;
 }catch(e){
  document.getElementById('err').textContent='המצלמה לא זמינה כאן - אפשר להעלות תמונה מהגלריה';
  document.getElementById('sh').style.display='none';
 }
 document.getElementById('sh').onclick=()=>{
  const cv=document.getElementById('cap');
  const vw=v.videoWidth||640,vh=v.videoHeight||480;
  const side=Math.min(vw,vh);
  cv.width=side;cv.height=side;
  const ctx=cv.getContext('2d');
  ctx.translate(side,0);ctx.scale(-1,1);
  ctx.drawImage(v,(vw-side)/2,(vh-side)/2,side,side,0,0,side,side);
  const url=cv.toDataURL('image/jpeg',.85);
  stopCam();processFace(pi,url);
 };
 document.getElementById('up').onclick=()=>{
  const f=document.getElementById('filepick');
  f.onchange=()=>{
   if(!f.files[0])return;
   const r=new FileReader();
   r.onload=()=>{shrink(r.result,url=>{stopCam();processFace(pi,url)})};
   r.readAsDataURL(f.files[0]);f.value='';
  };
  f.click();
 };
}
function shrink(url,cb){
 const im=new Image();
 im.onload=()=>{
  const k=Math.min(1,760/Math.max(im.width,im.height));
  const cv=document.getElementById('cap');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
  cb(cv.toDataURL('image/jpeg',.85));
 };
 im.src=url;
}
function save(){
 try{localStorage.setItem('facebattle',JSON.stringify({players:[{name:S.players[0].name,char:S.players[0].char,comp:S.players[0].comp,face:S.players[0].face,shot:S.players[0].shot,det:S.players[0].det,adj:S.players[0].adj},{name:S.players[1].name,char:S.players[1].char,comp:S.players[1].comp,face:S.players[1].face,shot:S.players[1].shot,det:S.players[1].det,adj:S.players[1].adj}],score:S.score,game:S.game,round:S.round}))}catch(e){}
}

/* ---------- init ---------- */
window.__g={S,renderMenu,renderSelect,renderAdjust,renderWin,endRound,startTttRound,startRpsRound};
(function init(){
 if(S.players[1].comp&&S.players[1].char){renderMenu()}
 else if(S.players[0].comp&&S.players[0].char){renderSelect(1)}
 else{renderSelect(0)}
})();
</script>
