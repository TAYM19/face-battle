<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>קרב הפרצופים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Heebo',system-ui,sans-serif;color:#fff;
  background:linear-gradient(160deg,#251c52 0%,#1a1440 45%,#150f33 100%);
  min-height:100vh;overflow-x:hidden;
  user-select:none;-webkit-user-select:none;
}
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:18px 20px 28px;position:relative}
h1{font-size:30px;font-weight:900;text-align:center;letter-spacing:.5px}
.sub{text-align:center;color:#cfc8f2;font-size:15px;margin-top:8px;line-height:1.5}
.steps{text-align:center;color:#b9b1e6;font-size:13.5px;margin-top:10px}
.steps b{color:#f6c445;font-weight:800}
.cta{
  display:block;width:100%;border:none;cursor:pointer;
  background:linear-gradient(180deg,#f8cd55,#f0a91e);
  color:#3a2503;font-family:inherit;font-weight:800;font-size:19px;
  padding:16px;border-radius:16px;margin-top:auto;
  box-shadow:0 8px 24px rgba(240,169,30,.35),inset 0 1px 0 rgba(255,255,255,.5);
}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.4;box-shadow:none}
.linkbtn{display:block;margin:14px auto 0;background:none;border:none;color:#a99ee0;font-family:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.card{
  position:relative;border-radius:18px;border:2px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.05);padding:10px 6px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;transition:border-color .15s,box-shadow .15s;
}
.card img{height:112px;max-width:100%;object-fit:contain;pointer-events:none}
.card .nm{margin-top:6px;font-weight:700;font-size:16px;color:#e9e4ff}
.card.sel{border-color:#f6c445;box-shadow:0 0 0 3px rgba(246,196,69,.35),0 6px 18px rgba(246,196,69,.18);background:rgba(246,196,69,.08)}
.card .check{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;background:#f6c445;display:none;align-items:center;justify-content:center}
.card.sel .check{display:flex}
.card .check svg{width:14px;height:14px}
.card.taken{opacity:.35;pointer-events:none}
.namefield{width:100%;margin-top:14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;padding:11px 14px;color:#fff;font-family:inherit;font-size:15px;outline:none}
.namefield:focus{border-color:#f6c445}
.namefield::placeholder{color:#8f86c0}
/* character with face */
.charbox{position:relative;display:inline-block}
.charbox>img.cimg{display:block;width:100%}
.face{position:absolute;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:#e8e0d0}
.face img{width:100%;height:100%;object-fit:cover;transform-origin:center;pointer-events:none}
.face.empty{background:#f2e7d3}
/* camera */
.camwrap{position:relative;margin-top:16px;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:3/4}
.camwrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.camhint{text-align:center;color:#cfc8f2;font-size:14px;margin-top:12px}
.shoot{display:flex;justify-content:center;margin-top:16px}
.shutter{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);cursor:pointer;position:relative}
.shutter::after{content:'';position:absolute;inset:5px;border-radius:50%;background:#f6c445}
/* adjust */
.adjwrap{position:relative;margin:14px auto 0;width:100%;max-width:340px}
.adjwrap .charbox{width:100%}
.zoomrow{display:flex;align-items:center;gap:12px;margin-top:14px;color:#cfc8f2;font-size:13px}
.zoomrow input{flex:1;accent-color:#f6c445}
/* scoreboard */
.scorebar{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.pchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 14px 5px 8px}
.pchip.me{border-color:#f6c445;box-shadow:0 0 12px rgba(246,196,69,.35)}
.pchip img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #f6c445}
.pchip .pn{font-weight:700;font-size:14px}
.scorebig{font-size:30px;font-weight:900;color:#f6c445;letter-spacing:2px}
/* ttt */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);border-radius:20px;padding:16px;margin:14px auto 0;width:100%;max-width:330px}
.cell{aspect-ratio:1;border-radius:14px;background:#241a52;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900}
.cell.x{color:#f6c445}.cell.o{color:#7ec8ff}
.cell.win{background:rgba(246,196,69,.25);box-shadow:0 0 14px rgba(246,196,69,.5)}
.turnnote{text-align:center;color:#cfc8f2;font-size:14px;margin-top:14px}
.turnnote b{color:#f6c445}
/* rps */
.rpsrow{display:flex;gap:12px;margin-top:20px}
.rpsbtn{flex:1;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);border-radius:16px;padding:18px 6px;cursor:pointer;color:#fff;font-family:inherit;font-size:17px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:8px}
.rpsbtn svg{width:44px;height:44px}
.rpsbtn:active{border-color:#f6c445}
.rpsreveal{display:flex;justify-content:space-around;align-items:center;margin-top:22px}
.rpspick{text-align:center}
.rpspick .rk{font-size:15px;font-weight:800;margin-top:8px;color:#f6c445}
/* veil */
.veil{margin-top:60px;text-align:center}
.veil .big{font-size:24px;font-weight:800;line-height:1.6}
/* win */
.winstage{position:relative;margin-top:6px;min-height:330px}
.winnerbox{position:absolute;right:-14px;bottom:0;width:64%}
.loserbox{position:absolute;left:-4px;bottom:0;width:37%;opacity:.95}
.dance{animation:dance 2.4s ease-in-out infinite;transform-origin:bottom center}
@keyframes dance{
 0%{transform:translateY(0) rotate(0) scale(1,1)}
 10%{transform:translateY(-6%) rotate(-7deg) scale(.96,1.05)}
 20%{transform:translateY(0) rotate(0) scale(1.07,.9)}
 30%{transform:translateY(-8%) rotate(7deg) scale(.95,1.07)}
 40%{transform:translateY(0) rotate(0) scale(1.08,.9)}
 50%{transform:translateY(-5%) rotate(0) scale(1,1)}
 62%{transform:translateY(-5%) rotate(180deg) scale(.92,1.08)}
 74%{transform:translateY(0) rotate(360deg) scale(1.06,.94)}
 87%{transform:translateY(-7%) rotate(352deg) scale(.95,1.06)}
 100%{transform:translateY(0) rotate(360deg) scale(1,1)}
}
/* funny per-character dances */
.d-sumo{animation-name:sumoD;animation-duration:2.6s}
@keyframes sumoD{
 0%{transform:translate(0,0) rotate(0) scale(1,1)}
 12%{transform:translate(-4%,0) rotate(-4deg) scale(1.06,.9)}
 20%{transform:translate(-2%,-6%) rotate(0) scale(.96,1.05)}
 30%{transform:translate(4%,0) rotate(4deg) scale(1.08,.88)}
 42%{transform:translate(0,-8%) rotate(0) scale(.94,1.06)}
 52%{transform:translate(0,0) scale(1.12,.85)}
 60%{transform:scale(1.17,.82)}
 66%{transform:scale(1.1,.88)}
 72%{transform:scale(1.14,.85)}
 82%{transform:translateY(-4%) scale(.98,1.02)}
 100%{transform:translate(0,0) rotate(0) scale(1,1)}
}
.d-bodybuilder{animation-name:bodyD;animation-duration:2.2s}
@keyframes bodyD{
 0%{transform:rotate(0) scale(1,1)}
 8%{transform:rotate(-8deg) scale(1.12,.92)}
 16%{transform:rotate(-8deg) scale(1.17,.89)}
 24%{transform:rotate(0) scale(1,1)}
 32%{transform:rotate(8deg) scale(1.12,.92)}
 40%{transform:rotate(8deg) scale(1.17,.89)}
 50%{transform:rotate(0) scale(1.05,.95)}
 58%{transform:translateY(-9%) scale(.95,1.08)}
 66%{transform:translateY(0) scale(1.14,.86)}
 74%{transform:scale(1.18,.83)}
 82%{transform:scale(1.1,.9)}
 100%{transform:rotate(0) scale(1,1)}
}
.d-ballerina{animation-name:ballD;animation-duration:3s;animation-timing-function:linear}
@keyframes ballD{
 0%{transform:translateX(0) rotate(0) scale(1,1)}
 12%{transform:translateX(6%) rotate(90deg) scale(.95,1.04)}
 25%{transform:translateX(10%) rotate(180deg) scale(1,1)}
 37%{transform:translateX(6%) rotate(270deg) scale(.95,1.04)}
 50%{transform:translateX(0) rotate(360deg) scale(1.02,.98)}
 62%{transform:translateX(-6%) rotate(450deg) scale(.95,1.04)}
 75%{transform:translateX(-10%) rotate(540deg) scale(1,1)}
 87%{transform:translateX(-6%) rotate(630deg) scale(.95,1.04)}
 100%{transform:translateX(0) rotate(720deg) scale(1,1)}
}
.d-disco{animation-name:discoD;animation-duration:1.6s}
@keyframes discoD{
 0%{transform:translate(0,0) rotate(0) scale(1,1)}
 12%{transform:translate(-5%,-4%) rotate(-6deg) scale(.97,1.03)}
 25%{transform:translate(0,-9%) rotate(0) scale(1,1.05)}
 37%{transform:translate(5%,-4%) rotate(6deg) scale(.97,1.03)}
 50%{transform:translate(0,0) rotate(0) scale(1.06,.92)}
 62%{transform:translate(-6%,-3%) rotate(-9deg) scale(.97,1.03)}
 75%{transform:translate(0,-7%) rotate(3deg) scale(1,1.04)}
 87%{transform:translate(6%,-3%) rotate(9deg) scale(.97,1.03)}
 100%{transform:translate(0,0) rotate(0) scale(1,1)}
}
.d-pirate{animation-name:pirD;animation-duration:2s}
@keyframes pirD{
 0%{transform:translate(0,0) rotate(0)}
 10%{transform:translate(-4%,-8%) rotate(-8deg)}
 20%{transform:translate(-4%,0) rotate(-4deg)}
 30%{transform:translate(0,-2%) rotate(0) scale(1.05,.93)}
 42%{transform:translate(4%,-10%) rotate(8deg)}
 54%{transform:translate(4%,0) rotate(4deg)}
 64%{transform:translate(0,0) rotate(0) scale(1.07,.9)}
 72%{transform:translateY(-6%) rotate(-6deg)}
 80%{transform:translateY(0) rotate(0) scale(1.04,.94)}
 88%{transform:translateY(-3%) rotate(5deg)}
 100%{transform:translate(0,0) rotate(0)}
}
.d-superhero{animation-name:supD;animation-duration:2.8s}
@keyframes supD{
 0%{transform:translateY(0) scale(1,1) rotate(0)}
 10%{transform:scale(1.06,.9)}
 22%{transform:translateY(-18%) scale(.92,1.12) rotate(-4deg)}
 30%{transform:translateY(-18%) scale(.95,1.08) rotate(4deg)}
 38%{transform:translateY(0) scale(1.14,.84)}
 46%{transform:scale(1.1,.9)}
 55%{transform:scale(1.05,.96) rotate(0)}
 62%{transform:rotate(-7deg) scale(1.1,.94)}
 72%{transform:rotate(7deg) scale(1.1,.94)}
 82%{transform:translateY(-5%) scale(.97,1.04)}
 100%{transform:translateY(0) scale(1,1) rotate(0)}
}
.d-rockstar{animation-name:rockD;animation-duration:1.4s;transform-origin:50% 60%}
@keyframes rockD{
 0%{transform:rotate(-14deg) translateY(0)}
 20%{transform:rotate(12deg) translateY(2%)}
 40%{transform:rotate(-14deg)}
 60%{transform:rotate(12deg) translateY(2%)}
 70%{transform:rotate(-6deg) translateY(-8%) scale(.96,1.06)}
 80%{transform:rotate(6deg) translateY(-4%)}
 90%{transform:rotate(-10deg) translateY(0) scale(1.05,.93)}
 100%{transform:rotate(-14deg) translateY(0)}
}
.d-chicken{animation-name:chickD;animation-duration:1.8s}
@keyframes chickD{
 0%{transform:translate(0,0) rotate(0) scale(1,1)}
 10%{transform:rotate(-8deg) scale(1.14,.94)}
 20%{transform:rotate(-8deg) scale(1.05,1)}
 30%{transform:translate(3%,-4%) rotate(6deg) scale(1.14,.94)}
 40%{transform:translate(3%,0) rotate(6deg) scale(1.05,1)}
 50%{transform:translate(0,-6%) rotate(0) scale(.96,1.05)}
 60%{transform:translate(-3%,0) rotate(-5deg) scale(1.12,.95)}
 70%{transform:translate(-3%,-3%) rotate(-5deg) scale(1.05,1)}
 80%{transform:translate(3%,-3%) rotate(5deg) scale(1.12,.95)}
 90%{transform:translate(0,0) rotate(0) scale(1.06,.94)}
 100%{transform:translate(0,0) rotate(0) scale(1,1)}
}
.sad{animation:sad 2.2s ease-in-out infinite;transform-origin:bottom center}
@keyframes sad{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) translateY(3px)}}
.bubble{position:absolute;background:#fff;color:#241a52;font-weight:800;font-size:14.5px;padding:9px 16px;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap;z-index:5}
.bubble::after{content:'';position:absolute;bottom:-7px;right:26px;border:8px solid transparent;border-top-color:#fff;border-bottom:none}
.confetto{position:absolute;width:9px;height:14px;border-radius:2px;top:-20px;animation:fall linear infinite;z-index:1}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
.winline{text-align:center;margin-top:14px}
.winline .t1{font-size:23px;font-weight:900;color:#f6c445}
.winline .t2{font-size:15px;color:#cfc8f2;margin-top:5px}
.roundov{position:fixed;inset:0;background:rgba(12,8,32,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:24px;text-align:center}
.roundov .charbox{width:150px}
.roundov .rt{font-size:24px;font-weight:900;margin-top:16px;color:#f6c445}
.roundov .rs{font-size:15px;color:#cfc8f2;margin-top:6px}
.hidden{display:none!important}
.cta.sticky{position:sticky;bottom:14px;margin-top:14px}
.hdr{display:flex;align-items:center;justify-content:center;position:relative}
.backbtn{position:absolute;right:0;background:rgba(255,255,255,.08);border:none;color:#cfc8f2;border-radius:10px;padding:7px 12px;font-family:inherit;font-size:13.5px;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="filepick" accept="image/*" class="hidden">
<video id="cam" playsinline autoplay muted class="hidden"></video>
<canvas id="cap" class="hidden"></canvas>
<script>
const HUMAN_CHARS={sumo:1,bodybuilder:1,ballerina:1,disco:1,pirate:1,superhero:1,rockstar:1};
const CHARS=[
 {id:'sumo',name:'סומו',w:378,h:470,fx:231,fy:66,fw:100,fh:112},
 {id:'bodybuilder',name:'שרירן',w:311,h:475,fx:169,fy:70,fw:100,fh:110},
 {id:'ballerina',name:'בלרינה',w:241,h:479,fx:120,fy:82,fw:80,fh:88},
 {id:'disco',name:'דיסקו',w:296,h:484,fx:154,fy:90,fw:88,fh:95},
 {id:'pirate',name:'פיראט',w:332,h:487,fx:191,fy:70,fw:95,fh:100},
 {id:'superhero',name:'גיבור על',w:365,h:471,fx:214,fy:60,fw:100,fh:105},
 {id:'rockstar',name:'רוקסטאר',w:384,h:476,fx:181,fy:74,fw:90,fh:95},
 {id:'chicken',name:'תרנגול',w:365,h:479,fx:189,fy:94,fw:96,fh:100},
]
const AI_PROMPTS={
 sumo:'a funny chubby sumo wrestler wearing a dark mawashi belt, arms spread wide, cheerful, barefoot',
 bodybuilder:'a funny bodybuilder with huge exaggerated muscles flexing both arms, wearing tiny posing trunks, confident grin',
 ballerina:'a graceful ballerina in a pink tutu and pointe shoes, arms raised above head in fifth position, one leg lifted',
 disco:'a funky 1970s disco dancer with a big afro, sparkly sequin jumpsuit, one finger pointing up, platform shoes',
 pirate:'a cartoon pirate with a big hat, eyepatch, striped shirt and boots, holding a cutlass, parrot optional',
 superhero:'a superhero in a bright cape and tights with an emblem on the chest, fists on hips, chest puffed out',
 rockstar:'a wild rockstar with crazy hair, leather jacket and ripped jeans, holding an electric guitar, tongue out',
 chicken:'a person in a silly full-body fluffy yellow chicken costume, wings spread, chicken feet, the fluffy costume hood frames the face on all sides, and a small red comb and tiny orange beak sit on top of the hood above the face'
};
const AI_STYLE='High quality 3D animated movie character render, modern Pixar-style animation, detailed materials and textures, cinematic soft studio lighting, exaggerated funny proportions. Full body, centered, standing, whole body visible head to toe. Plain solid flat very dark purple background (#1c1240), nothing else in the background, no text, no watermark, no frame.';

const WIN_TAUNTS=['אני האלוף!','תראה איך אני רוקד!','אלוף. העולם.','מי הבוס? אני הבוס!','קל מדי...'];
const LOSE_TAUNTS=['...לא יכול להיות','רימאטץ\'. עכשיו.','זה לא נגמר ככה','דרישת בדיקה!','נגמר לך המזל'];
const WIN_SCORE=3;
let S={
 screen:'select1',
 players:[
  {name:'',char:null,face:null,adj:{x:0,y:0,s:1.15}},
  {name:'',char:null,face:null,adj:{x:0,y:0,s:1.15}},
 ],
 sel:null, game:null, score:[0,0], round:1,
 board:null, turn:0, rps:[null,null], seriesWinner:null, ti:0
};
try{const s=localStorage.getItem('facebattle');if(s){const o=JSON.parse(s);if(o&&o.players)S=Object.assign(S,o);}}catch(e){}
function save(){try{localStorage.setItem('facebattle',JSON.stringify({players:S.players,score:S.score,game:S.game,round:S.round}))}catch(e){}}
const app=document.getElementById('app');
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function charOf(p){return CHARS.find(c=>c.id===p.char)}
function charBox(p,cls){
 const c=charOf(p);if(!c)return'';
 const st=`left:${c.fx/c.w*100}%;top:${c.fy/c.h*100}%;width:${c.fw/c.w*100}%;aspect-ratio:${c.fw}/${c.fh}`;
 const inner=p.face?`<img src="${p.face}" style="transform:translate(${p.adj.x}%,${p.adj.y}%) scale(${p.adj.s})">`:'';
 return `<div class="charbox ${cls||''}"><img class="cimg" src="${c.id}.webp" alt="${c.name}"><div class="face${p.face?'':' empty'}" style="${st}">${inner}</div></div>`;
}
function pName(i){return S.players[i].name||('שחקן '+(i+1))}
function scoreBar(active){
 return `<div class="scorebar">
  <div class="pchip${active===1?' me':''}">${S.players[0].face?`<img src="${S.players[0].face}">`:''}<span class="pn">${esc(pName(0))}</span></div>
  <div class="scorebig">${S.score[0]} : ${S.score[1]}</div>
  <div class="pchip${active===0?' me':''}">${S.players[1].face?`<img src="${S.players[1].face}">`:''}<span class="pn">${esc(pName(1))}</span></div>
 </div>`;
}
/* ---------- screens ---------- */
function renderSelect(pi){
 S.screen='select'+pi;
 const taken=S.players[1-pi].char;
 app.innerHTML=`
  <h1>${pi===0?'בחר את הדמות שלך':'שחקן 2 - בחר דמות'}</h1>
  <div class="sub">${pi===0?'הפנים שלך נכנסות ישר לתוך הדמות':'גם לך מגיעה דמות מצחיקה'}</div>
  <div class="steps"><b>1</b> בחר דמות · <b>2</b> צלם סלפי · <b>3</b> נצח והתרברג</div>
  <input class="namefield" id="nm" maxlength="12" placeholder="השם שלך (לא חובה)" value="${esc(S.players[pi].name)}">
  <div class="grid">${CHARS.map(c=>`
   <div class="card${S.sel===c.id?' sel':''}${taken===c.id?' taken':''}" data-id="${c.id}">
    <div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#3a2503" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <img src="${c.id}.webp" alt="${c.name}"><div class="nm">${c.name}</div>
   </div>`).join('')}
  </div>
  <button class="cta sticky" id="go" ${S.sel?'':'disabled'}>צלם סלפי ויאללה</button>`;
 app.querySelectorAll('.card').forEach(el=>el.onclick=()=>{
  S.sel=el.dataset.id;
  app.querySelectorAll('.card').forEach(x=>x.classList.toggle('sel',x.dataset.id===S.sel));
  document.getElementById('go').disabled=false;
 });
 document.getElementById('nm').oninput=e=>{S.players[pi].name=e.target.value.trim()};
 document.getElementById('go').onclick=()=>{S.players[pi].char=S.sel;S.sel=null;renderCam(pi)};
}
let stream=null;
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function renderCam(pi){
 S.screen='cam'+pi;
 const c=charOf(S.players[pi]);
 app.innerHTML=`
  <div class="hdr"><h1 style="font-size:24px">צלם סלפי</h1></div>
  <div class="sub">הפנים שלך יתלבשו על <b style="color:#f6c445">${c.name}</b> - תחייך!</div>
  <div class="camwrap"><video id="pv" playsinline autoplay muted></video></div>
  <div class="shoot"><button class="shutter" id="sh" aria-label="צלם"></button></div>
  <button class="linkbtn" id="up">או העלה תמונה מהגלריה</button>
  <div class="camhint" id="err"></div>`;

async function detectFaceE(img){
 const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
 try{
  await loadFaceApi();
  const opts=_model==='ssd'?new faceapi.SsdMobilenetv1Options({minConfidence:0.5}):new faceapi.TinyFaceDetectorOptions({inputSize:608,scoreThreshold:0.35});
  const ds=await faceapi.detectAllFaces(img,opts);
  const ok=ds.map(d=>d.box).filter(b=>b.width>iw*0.06&&b.height>ih*0.06&&b.width<iw*0.62&&b.height<ih*0.62&&b.x>-b.width*0.3&&b.y>-b.height*0.3&&b.x+b.width<iw*1.3&&b.y+b.height<ih*1.3&&b.height/b.width>0.85&&b.height/b.width<1.9);
  if(ok.length){
   ok.sort((a,b)=>b.width*b.height-a.width*a.height);
   const b=ok[0];
   const ex=Math.min(Math.max(b.x+b.width/2,iw*0.05),iw*0.95);
   const ey=Math.min(Math.max(b.y+b.height*0.5,ih*0.05),ih*0.95);
   const erx=Math.min(b.width*0.55,iw*0.4);
   const ery=Math.min(b.height*0.62,ih*0.45);
   return {ex,ey,erx,ery};
  }
 }catch(e){}
 // no reliable detection - skin centroid weighted toward typical selfie framing
 try{
  const w2=Math.min(380,iw),h2=Math.max(2,Math.round(ih*w2/iw));
  const cv=document.createElement('canvas');cv.width=w2;cv.height=h2;
  const cx2=cv.getContext('2d');cx2.drawImage(img,0,0,w2,h2);
  const dd=cx2.getImageData(0,0,w2,h2).data;
  const pcx=w2*0.5,pcy=h2*0.35,sx2=2*Math.pow(w2*0.26,2),sy2=2*Math.pow(h2*0.22,2);
  let swx=0,swy=0,sw=0,sxx=0,syy=0;
  for(let y=0;y<h2;y++)for(let x=0;x<w2;x++){
   const i=(y*w2+x)*4,r=dd[i],g=dd[i+1],b=dd[i+2];
   if(r>80&&r-b>20&&r-g>5&&g-b>5&&r<252){
    const dx=x-pcx,dy=y-pcy;
    const w=Math.exp(-(dx*dx/sx2+dy*dy/sy2));

   }
  }
  if(sw>w2*h2*0.005){
   const k=iw/w2;
   const cx=swx/sw,cy=swy/sw;
   const vx=Math.max(0,sxx/sw-cx*cx),vy=Math.max(0,syy/sw-cy*cy);
   let erx=Math.min(Math.max(Math.sqrt(vx)*1.6*k,iw*0.13),iw*0.26);
   let ery=Math.min(Math.max(Math.sqrt(vy)*1.6*k,ih*0.13),ih*0.24);
   if(erx>ery*0.95)erx=ery*0.95;
   if(erx<ery*0.7)erx=ery*0.7;
   return {ex:cx*k,ey:cy*k,erx,ery};
  }

function ringMean(data,w,h,cx,cy,rx,ry,r0,r1,skipTransparent){

// v5.3.3 segmentation identity restore: silhouette mask + neck occlusion + wide face tracking + seg warmup/timeout.
// v5.3.3: background warmup + bounded wait, so a fresh session never looks stuck
function __initSeger(){
 if(!window.__segerP){
  window.__segerP=(async()=>{
   const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
   const fileset=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
   const sg=await vision.ImageSegmenter.createFromOptions(fileset,{
    baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/1/selfie_multiclass_256x256.tflite'},
    runningMode:'IMAGE',outputCategoryMask:true});
   window.__seger=sg; return sg;
  })();
  window.__segerP.catch(()=>{window.__segerP=null});
 }
 return window.__segerP;
}
async function segmentPerson(img){
 try{
  const sg=window.__seger||await Promise.race([__initSeger(),new Promise(r=>setTimeout(()=>r(null),20000))]);
  if(!sg)return null;
  const r=sg.segment(img);
  if(!r||!r.categoryMask)return null;
  const cm=r.categoryMask;
  const w=cm.width,h=cm.height;
  const data=cm.getAsUint8Array();
  const out=new Uint8ClampedArray(w*h*4);
  for(let i=0;i<w*h;i++){
   const c=data[i];
   const keep=(c===1||c===2||c===3)?255:0;
   out[i*4]=out[i*4+1]=out[i*4+2]=255;out[i*4+3]=keep;
  }
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  cv.getContext('2d').putImageData(new ImageData(out,w,h),0,0);
  if(cm.close)cm.close();if(r.close)r.close();
  return cv;
 }catch(e){return null}
}
async function identityRestore(bakedUrl,shotUrl,c0){
 window.__irProg=[['enter',Date.now()]];
 const ai=await loadImg(bakedUrl),shot=await loadImg(shotUrl);
 window.__irProg.push(['loaded',Date.now()]);
 const W=ai.naturalWidth||ai.width,H=ai.naturalHeight||ai.height;
 const s=await detectFaceLA(shot);
 window.__irProg.push(['shotDet',Date.now()]);
 let t;
 {const sx=W/c0.w,sy=H/c0.h;
  t={ex:c0.fx*sx,ey:c0.fy*sy,erx:c0.fw/2*sx*0.92,ery:c0.fh/2*sy*0.92,angle:0,detected:true};
  try{
   await loadFaceApi();
   const opts=_model==='ssd'?new faceapi.SsdMobilenetv1Options({minConfidence:0.4}):new faceapi.TinyFaceDetectorOptions({inputSize:608,scoreThreshold:0.3});
   const ds=await faceapi.detectAllFaces(ai,opts).withFaceLandmarks();
   let best=null,bd=1e9;
   for(const d of ds){
    const b=d.detection.box;
    const bx=b.x+b.width/2,by=b.y+b.height*0.5;
    const dist=Math.hypot(bx-t.ex,by-t.ey);
    const okSize=b.width>t.erx*0.5&&b.width<t.erx*3.4; // v5.3.2
    if(okSize&&dist<t.ery*3.0&&dist<bd){bd=dist;best=d} // v5.3.2: follow klein head movement
   }
   if(best){
    const b=best.detection.box;
    t.ex=b.x+b.width/2;t.ey=b.y+b.height*0.5;
    if(best.landmarks){
     const mid=pts=>{let x=0,y=0;for(const q of pts){x+=q.x;y+=q.y}return{x:x/pts.length,y:y/pts.length}};
     const lc=mid(best.landmarks.getLeftEye()),rc=mid(best.landmarks.getRightEye());
     const a=Math.atan2(rc.y-lc.y,rc.x-lc.x);
     if(Math.abs(a)<0.5)t.angle=a;
    }
   }
  }catch(e){}
 }
 window.__irProg.push(['bakeScan',Date.now()]);
 const PAD=2.7,pw=Math.ceil(t.erx*2*PAD),ph=Math.ceil(t.ery*2*PAD);
 const pc=document.createElement('canvas');pc.width=pw;pc.height=ph;
 const px=pc.getContext('2d');
 px.translate(pw/2,ph/2);px.rotate(-t.angle);
 px.drawImage(ai,-t.ex,-t.ey);
 px.setTransform(1,0,0,1,0,0);
 const cx=pw/2,cy=ph/2,erx=t.erx,ery=t.ery;
 const pd0=px.getImageData(0,0,pw,ph).data;
 let fT=null;
 {let rs=0,gs=0,bs=0,n=0;
  for(let y=0;y<ph;y++)for(let x=0;x<pw;x++){
   const dx=(x-cx)/erx,dy=(y-cy)/ery;
   if(dx*dx+dy*dy>0.45)continue;
   const i=(y*pw+x)*4,r=pd0[i],g=pd0[i+1],b=pd0[i+2];
   if(0.299*r+0.587*g+0.114*b<45)continue;
   rs+=r;gs+=g;bs+=b;n++}
  if(n>120)fT={r:rs/n,g:gs/n,b:bs/n}}
 // source face layer in patch scale, rotated upright, anisotropic ellipse mapping
 const scx=Math.sqrt((erx/s.erx)*(ery/s.ery)),scy=scx; // v5.3.1 uniform scale - no feature distortion
 const K=1.50;
 const sw=Math.max(4,Math.round(s.erx*2*K*scx)),sh=Math.max(4,Math.round(s.ery*2*K*scy));
 const fc=document.createElement('canvas');fc.width=sw;fc.height=sh;
 const fx=fc.getContext('2d');
 fx.translate(sw/2,sh/2);fx.rotate(-s.angle);fx.scale(scx,scy);
 fx.translate(-s.ex,-s.ey);
 fx.drawImage(shot,0,0);
 fx.setTransform(1,0,0,1,0,0);
 // person mask from segmentation, same transform into patch space
 window.__irProg.push(['preSeg',Date.now()]);
 const segCv=await segmentPerson(shot);
 window.__irProg.push(['seg',Date.now()]);
 if(segCv){
  const mc=document.createElement('canvas');mc.width=sw;mc.height=sh;
  const mx=mc.getContext('2d');
  mx.translate(sw/2,sh/2);mx.rotate(-s.angle);mx.scale(scx,scy);
  mx.translate(-s.ex,-s.ey);
  const iw=shot.naturalWidth||shot.width,ih=shot.naturalHeight||shot.height;
  mx.drawImage(segCv,0,0,iw,ih);
  mx.setTransform(1,0,0,1,0,0);
  // erode semi-transparent fringe: square the alpha, then feather
  mx.globalCompositeOperation='destination-in';
  mx.drawImage(mc,0,0);
  // v5.3.2 neck occlusion: fade mask below jawline so costume covers the neck
  const _sc=s.ery*scx; // patch-space half face height (scx==scy uniform)
  const _g=mx.createLinearGradient(0,0,0,sh);
  const _y0=(sh/2+_sc*0.85)/sh,_y1=(sh/2+_sc*1.35)/sh;
  _g.addColorStop(0,'rgba(0,0,0,1)');_g.addColorStop(_y0,'rgba(0,0,0,1)');
  _g.addColorStop(_y1,'rgba(0,0,0,0)');_g.addColorStop(1,'rgba(0,0,0,0)');
  mx.fillStyle=_g;mx.fillRect(0,0,sw,sh);
  mx.globalCompositeOperation='source-over';
  const mc2=document.createElement('canvas');mc2.width=sw;mc2.height=sh;
  const mx2=mc2.getContext('2d');
  mx2.filter='blur(5px)';mx2.drawImage(mc,0,0);mx2.filter='none';
  fx.globalCompositeOperation='destination-in';
  fx.drawImage(mc2,0,0);
  fx.globalCompositeOperation='source-over';
 }else{
  // fallback: loose elliptical guard if segmentation unavailable
  const mk=document.createElement('canvas');mk.width=sw;mk.height=sh;
  const mctx=mk.getContext('2d');
  mctx.translate(sw/2,sh/2);mctx.scale(sw/2*0.62,sh/2*0.62);
  const mg=mctx.createRadialGradient(0,0,0,0,0,1);
  mg.addColorStop(0,'rgba(0,0,0,1)');mg.addColorStop(0.7,'rgba(0,0,0,1)');
  mg.addColorStop(1,'rgba(0,0,0,0)');
  mctx.fillStyle=mg;mctx.fillRect(-1.6,-1.6,3.2,3.2);
  mctx.setTransform(1,0,0,1,0,0);
  mctx.filter='blur(3px)';mctx.drawImage(mk,0,0);mctx.filter='none';
  fx.globalCompositeOperation='destination-in';fx.drawImage(mk,0,0);
  fx.globalCompositeOperation='source-over';
 }
 // tone match the real face to the scene lighting
 if(fT){
  const fImg=fx.getImageData(0,0,sw,sh);const dd=fImg.data;
  const ft2=ringMean(dd,sw,sh,sw/2,sh/2,sw/2*0.62,sh/2*0.62,0.25,0.75,false);
  if(ft2){
   const gr=Math.min(1.3,Math.max(0.78,fT.r/Math.max(1,ft2.r)));
   const gg=Math.min(1.3,Math.max(0.78,fT.g/Math.max(1,ft2.g)));
   const gb=Math.min(1.3,Math.max(0.78,fT.b/Math.max(1,ft2.b)));
   const ccx=sw/2,ccy=sh/2;
   for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){
    const dx=(x-ccx)/(sw/2),dy=(y-ccy)/(sh/2);
    const rad=Math.min(1,Math.sqrt(dx*dx+dy*dy));
    const w=0.55+0.45*rad;
    const i=(y*sw+x)*4;
    dd[i]=Math.min(255,dd[i]*(1+(gr-1)*w));
    dd[i+1]=Math.min(255,dd[i+1]*(1+(gg-1)*w));
    dd[i+2]=Math.min(255,dd[i+2]*(1+(gb-1)*w))}
   fx.putImageData(fImg,0,0)}}
 // paste with a loose elliptical guard (kills far outliers only; silhouette does the real work)
 const layer=document.createElement('canvas');layer.width=pw;layer.height=ph;
 const lx=layer.getContext('2d');
 lx.drawImage(fc,cx-sw/2,cy-sh/2);
 const mk=document.createElement('canvas');mk.width=pw;mk.height=ph;
 const mctx=mk.getContext('2d');
 mctx.translate(cx,cy);mctx.scale(erx*1.30,ery*1.30);
 const mg=mctx.createRadialGradient(0,0,0,0,0,1);
 mg.addColorStop(0,'rgba(0,0,0,1)');mg.addColorStop(0.85,'rgba(0,0,0,1)');
 mg.addColorStop(1,'rgba(0,0,0,0)');
 mctx.fillStyle=mg;mctx.fillRect(-1.15,-1.15,2.3,2.3);
 mctx.setTransform(1,0,0,1,0,0);
 mctx.filter='blur(4px)';mctx.drawImage(mk,0,0);mctx.filter='none';
 lx.globalCompositeOperation='destination-in';lx.drawImage(mk,0,0);
 lx.globalCompositeOperation='source-over';
 px.drawImage(layer,0,0);
 // soft inner shadow for depth
 px.save();
 px.translate(cx,cy);px.scale(erx,ery);
 const sg=px.createRadialGradient(0,0,0,0,0,1);
 sg.addColorStop(0.60,'rgba(25,12,4,0)');
 sg.addColorStop(0.82,'rgba(25,12,4,0.30)');
 sg.addColorStop(1,'rgba(25,12,4,0)');
 px.fillStyle=sg;px.fillRect(-1.1,-1.1,2.2,2.2);
 px.restore();
 try{window.__dbg={t:{ex:t.ex,ey:t.ey,erx:t.erx,ery:t.ery,angle:t.angle},s:{ex:s.ex,ey:s.ey,erx:s.erx,ery:s.ery,angle:s.angle},fT:fT,seg:!!segCv,post:pc.toDataURL('image/jpeg',0.9),srclayer:fc.toDataURL('image/jpeg',0.9)}}catch(e){}
 const out=document.createElement('canvas');out.width=W;out.height=H;
 const ox=out.getContext('2d');
 ox.drawImage(ai,0,0,W,H);
 ox.translate(t.ex,t.ey);ox.rotate(t.angle);
 ox.drawImage(pc,-pw/2,-ph/2);
 ox.setTransform(1,0,0,1,0,0);
 return out.toDataURL('image/jpeg',0.92);
}

async function processFace(pi,url){
 const p=S.players[pi];
 p.shot=url;p.det=null;p.adj={x:0,y:0,s:1};p.aiEdit=false;
 const ov=document.createElement('div');
 ov.className='roundov';
 ov.innerHTML='<div class="rt" style="margin-top:0">ה-AI מלביש אותך... ✨</div><div class="rs">יכול לקחת דקה-שתיים</div>';
 document.body.appendChild(ov);
 const c0b=charOf(p);
 let baked=null;
 if(c0b){
  for(let tries=0;tries<3&&!baked;tries++){
   const ai=await aiFaceBake(c0b,url).catch(()=>null);
   if(ai&&await faceOk(ai,c0b))baked=ai;
  }
 }
 if(baked){
  const rst=await identityRestore(baked,url,c0b).catch(()=>null);
  const small=await downscaleImg(rst||baked,720,0.87);
  p.comp=small;p.aiEdit=true;
  const im=await loadImg(small);
  const chip=document.createElement('canvas');chip.width=96;chip.height=96;
  chip.getContext('2d').drawImage(im,im.width*0.28,0,im.width*0.44,im.height*0.2,0,0,96,96);

 }
 ov.querySelector('.rt').textContent='מזהה את הפנים...';
 ov.querySelector('.rs').textContent='שנייה אחת';
 const c0=charOf(p);
 const hy2=c0?await hybridRealFace(c0.id+'.webp',url,c0.id).catch(()=>null):null;
 if(hy2){
  const small=await downscaleImg(hy2,720,0.87);
  p.comp=small;
  const im=await loadImg(small);
  const chip=document.createElement('canvas');chip.width=96;chip.height=96;
  chip.getContext('2d').drawImage(im,im.width*0.28,0,im.width*0.44,im.height*0.2,0,0,96,96);
  p.face=chip.toDataURL('image/jpeg',0.85);

function charBox(p,cls){

function shrink(url,cb){

  const k=Math.min(1,760/Math.max(im.width,im.height));
